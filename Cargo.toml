[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/adapters/dart",
    "crates/adapters/rust",
    "crates/adapters/typescript",
    "crates/adapters/python",
    "crates/adapters/go",
    "crates/engine",
    "crates/policy",
    "crates/ai-agent",
    "crates/cli",
    "crates/integrations/github-action",
    "crates/integrations/pre-commit",
]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive", "env"] }
async-trait = "0.1"
walkdir = "2.0"
regex = "1.0"
tempfile = "3.0"
which = "4.0"
schemars = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# AI/LLM
rig-core = "0.1"
rig-openai = "0.1"
rig-anthropic = "0.1"

# LSP for type info
lsp-types = "0.94"
tower-lsp = "0.20"

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unused_imports = "warn"

[profile.release]
lto = true
codegen-units = 1