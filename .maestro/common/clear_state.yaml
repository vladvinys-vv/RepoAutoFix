appId: com.android.settings
---
- runFlow:
    when:
      platform: iOS
    commands:
      - clearState: de.repoautofix.reposyncai
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp
      - tapOn: "Search.*"
      - inputText: "GitSync"
      - tapOn: "App info"
      - tapOn: "Storage & cache"
      - tapOn: "Clear storage"
      - tapOn: "Delete"
      - back
      - back
      - back
      - back
      - killApp
